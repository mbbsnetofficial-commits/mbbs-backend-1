services:
  mbbs-backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    expose:
      - "3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
      - CONNECTION_STRING=${CONNECTION_STRING}
      - BLOG_CONNECTION_STRING=${BLOG_CONNECTION_STRING}
      - BLOG_DATABASE_NAME=${BLOG_DATABASE_NAME}
      - SECRET_KEY=${SECRET_KEY}
      - REFRESH_SECRET_KEY=${REFRESH_SECRET_KEY}
      - LOGIN_EXPIRES=${LOGIN_EXPIRES}
      - REFRESH_TOKEN_EXPIRES=${REFRESH_TOKEN_EXPIRES}
      - ADMIN_SECRET_KEY=${ADMIN_SECRET_KEY}
      - ADMIN_LOGIN_EXPIRES=${ADMIN_LOGIN_EXPIRES}
      - RESET_OTP_SECRET=${RESET_OTP_SECRET}
      - SIGNUP_OTP_SECRET=${SIGNUP_OTP_SECRET}
      - FRONTEND_URL=${FRONTEND_URL}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
      - PUBLIC_API_URL=${PUBLIC_API_URL}
      - APP_TIMEZONE=${APP_TIMEZONE}
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASSWORD=${SMTP_PASSWORD}
      - SMTP_FROM=${SMTP_FROM}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
      - FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}
      - FIREBASE_CLIENT_EMAIL=${FIREBASE_CLIENT_EMAIL}
      - FIREBASE_PRIVATE_KEY=${FIREBASE_PRIVATE_KEY}
      - SWAGGER_PASSWORD=${SWAGGER_PASSWORD}
    networks:
      - dokploy-network

networks:
  dokploy-network:
    external: true
